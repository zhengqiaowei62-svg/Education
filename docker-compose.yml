version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化运行时数据（不会被 .gitignore 影响，是容器卷）
      - ./backend/storage/data:/app/backend/storage/data
      - ./backend/storage/uploads:/app/backend/storage/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
